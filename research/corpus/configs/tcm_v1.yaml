excluded_sources:
  - source_id: tcmm_knowledge_graph
    reason: Reference implementation only; repository has no license and some facts are LLM-derived.
  - source_id: zhongjing_tcm_benchmark
    reason: Evaluation-only; repository lacks an actual LICENSE file and answers must not enter retrieval knowledge.
  - source_id: zhongjing_omni
    reason: Evaluation-only; claimed dataset files are absent and no license is provided.
  - source_id: symmap_mm_symptoms_targets
    reason: SMMS and SMTT were acquired for audit reproducibility but are excluded from TCM Corpus v1 because they are modern-medicine symptoms/targets without selected TCM relations.

known_limitations:
  - Corpus v1 covers herbs and syndrome terminology but not reliable TCM symptom relations, prescriptions, acupuncture, meridians as independent theory records, or constitution analysis.
  - Upstream Chinese cells contain mojibake in downloaded files; corrupted text is preserved but excluded from retrieval text.
  - Restricted-source normalized records and chunks cannot be redistributed until maintainers confirm permission.
  - Source claims require independent qualified TCM review before clinical or authoritative use.
