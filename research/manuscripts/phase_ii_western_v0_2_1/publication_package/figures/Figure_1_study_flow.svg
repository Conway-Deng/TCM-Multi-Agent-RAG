<text x="1180.00" y="627.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1F242D">Descriptive Handling Only:</text>
<text x="1180.00" y="649.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F242D">4-Category Rubric:</text>
<text x="1180.00" y="671.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A6578">1. Appropriate abstention</text>
<text x="1180.00" y="691.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A6578">2. Bounded insufficiency</text>
<text x="1180.00" y="711.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A6578">3. Substantive unack.</text>
<text x="1180.00" y="731.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A6578">4. Overclaim beyond pilot</text>
<line x1="1070.00" y1="747.00" x2="1290.00" y2="747.00" stroke="#E2E6EC" stroke-width="1"/>
<text x="1180.00" y="769.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#64748B">No hypothesis testing (n = 6)</text>
<text x="1040.00" y="916.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A6578">Rubric-grounded textual evaluation · Not expert clinician validation · No causal claim</text>
