<text x="1040.00" y="362.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5A6578">Independent Post-Study Evaluation · Reuses Frozen Answers</text>
<rect x="775.00" y="383.00" width="530.00" height="120.00" rx="6" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.5"/>
<text x="1040.00" y="411.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F242D">Blinded Evidence-Grounded Semantic Evaluator</text>
<text x="1040.00" y="435.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5A6578">Single evaluator: GPT-5.6 Sol · condition labels concealed during judging</text>
<text x="1040.00" y="457.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5A6578">Evaluated solely against frozen expected points &amp; top-4 retrieved passages</text>
<text x="1040.00" y="481.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A">Does not reopen or retroactively complete historical Stage C</text>
