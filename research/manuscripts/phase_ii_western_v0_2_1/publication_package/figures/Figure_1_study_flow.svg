<text x="700.00" y="135.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5A6578">16 PMC Open Access Systematic Reviews (4 Topic Domains)</text>
<text x="700.00" y="157.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5A6578">271 deterministic chunks · structured source provenance</text>
