<text x="360.00" y="568.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5A6578">Fixed Qwen/Qwen3-8B generator (temp 0, max 256 tokens)</text>
<text x="360.00" y="588.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5A6578">192 primary answers completed · frozen dataset preserved</text>
<text x="360.00" y="610.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5A6578">Supplies generated text; does not estimate semantic quality by itself</text>
