<text x="360.00" y="779.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5A6578">W-RQ2 and W-RQ3 formal estimates unavailable within v0.1.5</text>
