<text x="900.00" y="717.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A6578">Partial-credit coverage</text>
<text x="900.00" y="735.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A6578">Unsupported-claim presence</text>
<text x="900.00" y="753.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A6578">Contradiction presence</text>
<text x="900.00" y="775.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2B4C7E">Exact McNemar tests vs R0</text>
