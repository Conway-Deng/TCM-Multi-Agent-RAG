<text x="360.00" y="431.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5A6578">4 retrieval conditions (R0 lexical, R1 dense, R2 fusion, R3 rerank) × 48 cases</text>
<text x="360.00" y="451.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5A6578">192/192 retrieval cells completed · 0 technical missingness</text>
<text x="360.00" y="473.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1F242D">W-RQ1 estimable: headline recall, Hit@4, and MRR (n = 42)</text>
