<text x="700.00" y="252.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5A6578">42 answerable cases (W-RQ1 &amp; W-RQ2) · 6 insufficient-evidence cases (W-RQ3)</text>
